<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Room Types - Admin Panel</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: rgba(25, 25, 25, 0.7);
            --gold: #D4AF37;
            --gold-hover: #F3E5AB;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: rgba(255, 255, 255, 0.08);
            --danger: #ff4c4c;
            --success: #4caf50;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Montserrat', sans-serif;
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex-grow: 1;
            padding: 2rem 3rem;
            width: 100%;
        }

        /* Top Header */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title h1 {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 500;
        }

        .header-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
            width: 350px;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: var(--font-body);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--gold);
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .btn-primary {
            background: var(--gold);
            color: var(--bg-dark);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            font-family: var(--font-body);
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: var(--gold-hover);
            transform: translateY(-2px);
        }

        .table-container {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1.2rem;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        
        .amenities-list {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .amenity-tag {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .room-count-badge {
            background: rgba(212, 175, 55, 0.1);
            color: var(--gold);
            padding: 0.4rem 0.8rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(212, 175, 55, 0.2);
            display: inline-block;
            white-space: nowrap;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            color: var(--text-primary);
            border-color: var(--text-primary);
        }

        .btn-icon.delete:hover {
            color: var(--danger);
            border-color: var(--danger);
            background: rgba(255, 76, 76, 0.1);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            transform: translateY(-20px);
            transition: all 0.3s ease;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-header h2 {
            font-family: var(--font-heading);
            color: var(--gold);
            font-size: 1.5rem;
        }

        .close-modal {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
        }
        
        .form-row .form-group {
            flex: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 0.8rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: var(--font-body);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--gold);
        }

        /* File Upload Styles */
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 120px;
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-upload-wrapper:hover {
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }

        .file-upload-input {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 2;
        }

        .file-upload-design {
            text-align: center;
            z-index: 1;
            pointer-events: none; /* Let the invisible input handle the interactions */
        }

        .file-upload-design i {
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
        }

        .file-upload-design p {
            font-size: 0.9rem;
            color: var(--text-primary);
            margin-bottom: 0.2rem;
            transition: color 0.3s ease;
        }

        .file-upload-design .file-info {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        table td p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
            max-width: 250px;
        }

        /* Checkbox Grid for Amenities */
        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            background: rgba(0,0,0,0.2);
            padding: 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            color: var(--text-primary);
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            accent-color: var(--gold);
            width: 16px;
            height: 16px;
        }

        .modal-footer {
            margin-top: 2rem;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <main class="main-content">
        <header class="top-header">
            <div class="header-title">
                <h1>Manage Room Types</h1>
                <p class="header-subtitle">Define categories, base pricing, capacities, and amenities.</p>
            </div>
        </header>

        <div class="controls-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search by Type Name...">
            </div>
            <button class="btn-primary" id="addTypeBtn">
                <i class="fas fa-plus"></i> Add New Room Type
            </button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Type Name</th>
                        <th>Base Price / Night</th>
                        <th>Max Capacity</th>
                        <th>Key Amenities</th>
                        <th>Description</th>
                        <th>Total Rooms</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </main>

    <div class="modal-overlay" id="typeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Room Type</h2>
                <button class="close-modal" id="closeModalBtn"><i class="fas fa-times"></i></button>
            </div>
            
            <form id="addTypeForm" action="../Controler/room_types.php" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="typeName">Type Name</label>
                    <input type="text" id="typeName" name="typeName" class="form-control" placeholder="e.g., Presidential Suite" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="basePrice">Base Price / Night ($)</label>
                        <input type="number" id="basePrice" name="basePrice" class="form-control" min="0" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label for="maxCapacity">Max Guests Capacity</label>
                        <input type="number" id="maxCapacity" name="maxCapacity" class="form-control" min="1" placeholder="e.g., 2" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" class="form-control" placeholder="Brief description of the room type for the booking page..."></textarea>
                </div>

                <div class="form-group">
                    <label>Thumbnail Image</label>
                    <div class="file-upload-wrapper">
                        <input type="file" id="roomThumbnail" name="roomThumbnail" accept="image/png, image/jpeg, image/webp" class="file-upload-input" required>
                        <div class="file-upload-design">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p id="uploadText">Click or drag image here to upload</p>
                            <span class="file-info">Maximum size: 2MB (JPG, PNG, WEBP)</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Default Amenities</label>
                    <div class="checkbox-grid">
                        <label class="checkbox-label"><input type="checkbox" name="amenities[]" value="wifi"> Free Wi-Fi</label>
                        <label class="checkbox-label"><input type="checkbox" name="amenities[]" value="tv"> Smart TV</label>
                        <label class="checkbox-label"><input type="checkbox" name="amenities[]" value="ac"> Air Conditioning</label>
                        <label class="checkbox-label"><input type="checkbox" name="amenities[]" value="minibar"> Minibar</label>
                        <label class="checkbox-label"><input type="checkbox" name="amenities[]" value="bathtub"> Bathtub</label>
                        <label class="checkbox-label"><input type="checkbox" name="amenities[]" value="balcony"> Balcony</label>
                        <label class="checkbox-label"><input type="checkbox" name="amenities[]" value="safe"> In-room Safe</label>
                        <label class="checkbox-label"><input type="checkbox" name="amenities[]" value="coffee"> Coffee Maker</label>
                        <label class="checkbox-label"><input type="checkbox" name="amenities[]" value="service"> 24/7 Room Service</label>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="cancelModalBtn">Cancel</button>
                    <!-- Submits to PHP -->
                    <button type="submit" name="saveRoomType" class="btn-primary">Save Room Type</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('typeModal');
            const addBtn = document.getElementById('addTypeBtn');
            const closeBtn = document.getElementById('closeModalBtn');
            const cancelBtn = document.getElementById('cancelModalBtn');

            // Open modal
            addBtn.addEventListener('click', () => {
                modal.classList.add('active');
            });

            // Close modal functions
            const closeModal = () => {
                modal.classList.remove('active');
            };

            closeBtn.addEventListener('click', closeModal);
            cancelBtn.addEventListener('click', closeModal);

            // Close modal if clicking outside the content box
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    closeModal();
                }
            });

            // Handle File Upload UI Feedback
            const fileInput = document.getElementById('roomThumbnail');
            const uploadText = document.getElementById('uploadText');

            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    // Update text to show the selected file name
                    uploadText.textContent = this.files[0].name;
                    uploadText.style.color = 'var(--gold)';
                } else {
                    // Reset if cancelled
                    uploadText.textContent = 'Click or drag image here to upload';
                    uploadText.style.color = 'var(--text-primary)';
                }
            });
        });

        let roomTypesData = async ()=>{
            console.log("Fetching room types data...");
            let promise = await fetch("../Controler/room_types.php");
            let data = await promise.json();
            data.forEach(element => {
                let row = document.createElement("tr");
                row.innerHTML = `<td><strong>${element.name}</strong></td>
                                <td>${element.price_per_night}</td>
                                <td>${element.max_capacity}</td>
                                <td>
                                    <div class="amenities-list">
                                    ${JSON.parse(element.amenities).map(amenity => `<span class="amenity-tag"> ${amenity}</span>`).join('')}
                                    </div>
                                </td>
                                <td><p>${element.description}</p></td>
                                <td><span class="room-count-badge">${element.total_rooms} rooms</span></td>
                                <td>
                                    <div class="action-btns">
                                        <button class="btn-icon" title="Edit"><i class="fas fa-edit"></i></button>
                                        <button class="btn-icon delete" title="Delete"><i class="fas fa-trash"></i></button>
                                    </div>
                                </td>`;
                document.querySelector("tbody").appendChild(row);
            });
        };
        roomTypesData();

        const params = new URLSearchParams(window.location.search);
        const success = params.get('success');
        const error = params.get('error');
        if(success) {
            Components.showToast("Success", "Room type added successfully!");
        } 
        else if(error) {
            Components.showToast("Error", "An error occurred while adding the room type. Please try again.");
        }
    </script>
</body>
</html>
