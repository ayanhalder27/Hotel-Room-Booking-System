<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuxeStay - Premium Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="glass-wrapper">
        <div class="login-card" id="card">
            
            <div class="brand-header">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 21h18"></path>
                        <path d="M5 21V7l8-4v18"></path>
                        <path d="M19 21V11l-6-3"></path>
                        <path d="M9 9v.01"></path>
                        <path d="M9 13v.01"></path>
                        <path d="M9 17v.01"></path>
                    </svg>
                </div>
                <h1>Welcome to LuxeStay</h1>
                <p>Enter your credentials to access the portal</p>
            </div>

            <form id="loginForm" novalidate action="../Controler/login.php" method="POST">
                <div class="form-group" id="userGroup">
                    <label for="username">Username or Email</label>
                    <div class="input-wrapper">
                        <input type="text" name="username" id="username" class="form-input" placeholder="admin@luxestay.com" autocomplete="username">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <span class="error-msg">Please enter a valid username</span>
                </div>

                <div class="form-group" id="passGroup">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" id="password" class="form-input" placeholder="••••••••" autocomplete="current-password">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <button type="button" class="toggle-password" id="togglePass" aria-label="Toggle password">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="error-msg">Password is required</span>
                </div>

                <div class="form-options">
                    <label class="remember-wrapper">
                        <input type="checkbox" name="rememberMe" id="rememberMe">
                        <span class="remember-text">Remember me</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="showToast('Password Recovery', 'Redirecting to reset portal...')">Forgot Password?</a>
                </div>

                <button type="submit" name="login" class="btn-primary" id="loginBtn">
                    <span id="btnText">Sign In</span>
                    <div class="loader" id="btnLoader"></div>
                </button>
            </form>

            <div class="auth-footer">
                New to LuxeStay? <a href="#" onclick="showToast('Create Account', 'Opening registration page...')">Create an account</a>
            </div>

        </div>
    </div>

    <div class="toast-container" id="toastBox"></div>

    <script src="login.js"></script>
</body>
</html>
